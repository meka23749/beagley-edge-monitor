name: Build Edge Monitor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-app:
    name: Build Edge Monitor (C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile edge-monitor
        run: |
          cd meta-beagley-monitor/recipes-app/edge-monitor/files
          make
      - name: Run edge-monitor
        run: |
          cd meta-beagley-monitor/recipes-app/edge-monitor/files
          ./edge-monitor 2

  unit-tests:
    name: Unit Tests (logic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run unit tests
        run: |
          gcc -I meta-beagley-monitor/recipes-app/edge-monitor/files -I tests/unity \
              tests/test_monitor_logic.c \
              meta-beagley-monitor/recipes-app/edge-monitor/files/monitor_logic.c \
              tests/unity/unity.c \
              -o test_logic
          ./test_logic

  unit-tests-arm:
    name: Unit Tests (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run unit tests on ARM64
        run: |
          gcc -I meta-beagley-monitor/recipes-app/edge-monitor/files -I tests/unity \
              tests/test_monitor_logic.c \
              meta-beagley-monitor/recipes-app/edge-monitor/files/monitor_logic.c \
              tests/unity/unity.c \
              -o test_logic_arm
          ./test_logic_arm

  test-dashboard:
    name: Test Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Flask
        run: pip install flask
      - name: Test API endpoints
        run: |
          cd meta-beagley-monitor/recipes-app/web-dashboard/files
          python3 -c "
          from app import app
          client = app.test_client()
          r = client.get('/api/health')
          assert r.status_code == 200
          print('Health check OK')
          r = client.get('/api/sensors')
          assert r.status_code == 200
          print('Sensors API OK')
          "

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C code analysis
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --error-exitcode=1 \
            meta-beagley-monitor/recipes-app/edge-monitor/files/edge_monitor.c \
            meta-beagley-monitor/recipes-app/edge-monitor/files/monitor_logic.c
          echo "C code OK"